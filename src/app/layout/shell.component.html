<div class="shell">
  <header class="topbar">
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Menüyü aç"
    >
      <span class="menu-icon" aria-hidden="true"></span>
    </button>

    <a class="brand" routerLink="/dashboard" (click)="closeMenu()">Tahakkuk</a>

    <nav class="desktop-nav" aria-label="Ana menü">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      @if (user()) {
        <a routerLink="/profile" routerLinkActive="active">Profil</a>
      }
    </nav>

    <div class="topbar-user">
      @if (user()) {
        <span class="user-email">{{ user()?.email }}</span>
        <button type="button" class="logout" (click)="logout()">Çıkış</button>
      } @else {
        <a class="login-link" routerLink="/login">Giriş yap</a>
      }
    </div>
  </header>

  <div
    class="backdrop"
    [class.backdrop--visible]="menuOpen()"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>

  <aside class="sidebar" [class.sidebar--open]="menuOpen()">
    <div class="sidebar-header">
      <span class="brand">Tahakkuk</span>
      <button type="button" class="close" (click)="closeMenu()" aria-label="Menüyü kapat">
        &times;
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Mobil menü">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
      @if (user()) {
        <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">Profil</a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (user()) {
        <span class="user-email">{{ user()?.email }}</span>
        <button type="button" class="logout logout--block" (click)="logout()">Çıkış yap</button>
      } @else {
        <a class="login-link login-link--block" routerLink="/login" (click)="closeMenu()">
          Giriş yap
        </a>
      }
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>

  <app-footer />
</div>
