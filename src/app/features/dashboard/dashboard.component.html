<section class="page">
  <section class="modules">
    <div class="modules-header">
      <h2>Modüller</h2>
      <p class="modules-hint">Tahakkuk işlemlerinizi modüller üzerinden yürütün.</p>
    </div>

    <div class="module-grid">
      @for (module of modules; track module.title) {
        <a class="module-card" [routerLink]="module.path">
          <span class="module-code" aria-hidden="true">{{ module.code }}</span>
          <span class="module-title">{{ module.title }}</span>
          <span class="module-description">{{ module.description }}</span>
          <span class="module-action">Modülü aç</span>
        </a>
      }
    </div>
  </section>
</section>
